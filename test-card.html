<!DOCTYPE html>
<html><head><title>Card Test</title>
<style>
:root {
--cream:#faf7f2;--w:#fff;--td:#1a1a1a;--tm:#7a7a7a;--gold:#c9a96e;--goldd:#b08d4f;--gd:#0b3d2e;
}
* { box-sizing:border-box; margin:0; padding:0 }
body { font-family:Inter,sans-serif; background:var(--cream); padding:40px }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; max-width:1200px; margin:0 auto }
.pcard { background:var(--w); border-radius:14px; overflow:hidden }
.pcard-imgwrap { position:relative; width:100%; aspect-ratio:1; background:var(--cream); overflow:hidden }
.pcard-imglink { display:block; width:100%; height:100%; position:relative }
.pcard-img-default { display:block; width:100%; height:100%; object-fit:contain; padding:18px; position:relative; z-index:1; transition:opacity .35s }
.pcard-img-hover { display:block; position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s; z-index:2 }
.pcard:hover .pcard-img-default { opacity:0 }
.pcard:hover .pcard-img-hover { opacity:1 }
.pcard-info { padding:14px; text-align:center }
.pcard-name { font-family:Cormorant Garamond,serif; font-size:17px; font-weight:600; color:var(--td); margin-bottom:4px; display:block }
.pcard-price { font-size:17px; font-weight:700; color:var(--gd); margin:6px 0 }
.qa-btn { display:block; width:100%; padding:10px; background:var(--gd); color:#fff; font-size:11px; font-weight:700; text-transform:uppercase; border-radius:7px; text-decoration:none; margin-top:8px }
</style></head>
